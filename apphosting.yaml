# Firebase App Hosting configuration
# Client config and server secrets are read from Cloud Secret Manager so live
# values are not committed. NEXT_PUBLIC_* values are still inlined into the
# browser bundle at build time. Create the secrets before the next rollout.
# See README.md for the required variables.
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 100
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_CONFIG
    secret: NEXT_PUBLIC_FIREBASE_CONFIG
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: FIREBASE_SERVICE_ACCOUNT
    secret: FIREBASE_SERVICE_ACCOUNT
    availability:
      - RUNTIME
