# Web service. Railway reads this file for a service whose config path is
# unset until 2026-12-01. The email cron service must use railway.worker.toml
# instead, or it will start the web server. After that date, use
# .railway/railway.ts. Do not apply that file until the cutover plan is approved.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node server.js"
preDeployCommand = ["node dist/migrate.js"]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
